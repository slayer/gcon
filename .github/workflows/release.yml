name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: |
          mkdir -p bin
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/gcon-darwin-amd64 ./cmd/gcon
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/gcon-darwin-arm64 ./cmd/gcon

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/gcon-linux-amd64 ./cmd/gcon
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/gcon-linux-arm64 ./cmd/gcon

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/gcon-windows-amd64.exe ./cmd/gcon

      - name: Create checksums
        run: |
          cd bin
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/gcon-darwin-amd64
            bin/gcon-darwin-arm64
            bin/gcon-linux-amd64
            bin/gcon-linux-arm64
            bin/gcon-windows-amd64.exe
            bin/checksums.txt
