version: "2"

# schema: https://golangci-lint.run/jsonschema/golangci.jsonschema.json
# reference: https://raw.githubusercontent.com/golangci/golangci-lint/2ed365c7944938b15a969dd36be9637b6c9c0d9e/.golangci.reference.yml

linters:
  # Use default: none instead of disable-all
  default: none

  enable:
    # Core static analysis
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Error handling
    - errorlint
    - err113
    - errname
    - nilnil
    - nilerr
    # Code quality
    - gocognit
    - gocritic
    # Style
    - unconvert
    - mirror
    - misspell
    - nakedret
    # Modern Go
    - copyloopvar
    - intrange

  # Linter-specific settings
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    gocognit:
      min-complexity: 50

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
      disabled-checks:
        - whyNoLint
        - commentFormatting

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

  # Exclusions per-path, per-linter
  exclusions:
    rules:
      # Exclude some linters from running on tests
      - path: _test\.go
        linters:
          - gocognit
          - dupl

      # Exclude shadow checking on err/ctx
      - linters:
          - govet
        text: 'shadow: declaration of "(err|ctx)"'

      # Exclude linters for generated code
      - path: ".*\\.pb\\.go$"
        linters:
          - staticcheck
          - errcheck
          - govet

      # Allow dot imports for Bubble Tea DSL in tests
      - path: _test\.go
        linters:
          - revive
        text: "dot-imports"

      # Cognitive complexity can be higher in main Update methods (Bubble Tea pattern)
      - path: "(app|model)\\.go$"
        text: "cognitive complexity"
        linters:
          - gocognit

      # err113: Validation errors in validators.go (justified - UX requires dynamic messages)
      - path: internal/ui/components/forms/validators\.go
        linters:
          - err113

      # gosec: Already reviewed and justified
      - linters:
          - gosec
        text: "G304.*file inclusion"

      # gocognit: Complex functions that will be refactored later
      - path: internal/ui/components/forms/field\.go
        linters:
          - gocognit
        text: "cognitive complexity.*of func.*Field.*Update"
      - path: internal/ui/views/instances\.go
        linters:
          - gocognit
        text: "cognitive complexity.*of func.*InstancesView.*Update"
      - path: internal/ui/views/instance_details\.go
        linters:
          - gocognit
        text: "cognitive complexity.*of func.*InstanceDetailsView.*Update"
      - path: internal/ui/views/disks\.go
        linters:
          - gocognit
        text: "cognitive complexity.*of func.*DisksView.*Update"
      - path: internal/ui/views/objects\.go
        linters:
          - gocognit
        text: "cognitive complexity.*of func.*ObjectsView.*Update"
      - path: internal/ui/views/object_details\.go
        linters:
          - gocognit
        text: "cognitive complexity.*of func.*ObjectDetailView.*Update"

issues:
  max-issues-per-linter: 50
  max-same-issues: 3

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
  modules-download-mode: readonly
  concurrency: 4
  allow-parallel-runners: true
