version: "2"

# Timeout for analysis
timeout: 5m

# Output configuration
output:
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

# Linters configuration
linters:
  # Disable all default linters, enable explicitly
  disable-all: true
  enable:
    # Enabled-by-default linters (core static analysis)
    - errcheck      # Check for unchecked errors
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis (metalinter, includes gosimple, stylecheck, unused)
    - unused        # Check for unused code

    # Additional error handling & bugs
    - errorlint     # Error wrapping (Go 1.13+)
    - err113        # Error definition rules
    - errname       # Error naming conventions (ErrXxx, XxxError)
    - nilnil        # Checks that there is no simultaneous return of nil error and an invalid value
    - nilerr        # Find code returning nil when error is not nil

    # Performance
    # - prealloc      # Finds slice declarations that could be preallocated (DISABLED: 9 baseline issues)
    # - noctx         # Finds sending HTTP requests without context.Context (DISABLED: 3 baseline issues)

    # Code quality
    # - revive        # Fast, configurable, extensible linter (replaces golint)
    - gocognit      # Computes cognitive complexity
    # - gocyclo       # Computes cyclomatic complexity (DISABLED: 7 baseline issues in Update methods)
    # - maintidx      # Measures maintainability index (DISABLED: 2 baseline issues)
    # - nestif        # Reports deeply nested if statements
    - gocritic      # Extensive Go linter

    # Style & consistency
    - unconvert     # Remove unnecessary type conversions
    # - unparam       # Reports unused function parameters (DISABLED: 1 baseline issue)
    - mirror        # Reports wrong mirror patterns of bytes/strings usage

    # Security
    # - gosec         # Inspects source code for security problems (DISABLED: 9 baseline issues)

    # Code smells
    # - goconst       # Finds repeated strings that could be constants (DISABLED: 15 baseline issues)
    # - dupl          # Code clone detection
    - misspell      # Finds commonly misspelled English words
    - nakedret      # Finds naked returns in functions greater than a specified length

    # Modern Go features (1.22+)
    - copyloopvar   # Detects places where loop variables are copied
    - intrange      # Finds places where int range loops can be used

settings:
  # Error handling settings
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close

  errorlint:
    errorf: true
    asserts: true
    comparison: true

  # Cognitive complexity limit
  gocognit:
    min-complexity: 50

  # Cyclomatic complexity limit
  gocyclo:
    min-complexity: 15

  # Maintainability index
  maintidx:
    under: 20  # Warn if maintainability index is below 20

  # Nested if depth
  nestif:
    min-complexity: 5

  # Security settings
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Errors unhandled (covered by errcheck)
      - G304  # File path join (often false positive for file operations)

  # Code quality settings
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
    disabled-checks:
      - whyNoLint  # Requires explanation for nolint directives (can be noisy)
      - commentFormatting  # Comment formatting rules

  revive:
    severity: warning
    confidence: 0.8
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id
      - name: function-result-limit
        arguments: [3]
      - name: cognitive-complexity
        arguments: [20]
      - name: cyclomatic
        arguments: [15]

  # Code smell settings
  goconst:
    min-len: 3
    min-occurrences: 3
    ignore-tests: true

  dupl:
    threshold: 100  # Tokens threshold for duplicate detection

  misspell:
    locale: US

  nakedret:
    max-func-lines: 30  # Naked returns only in very short functions

# Issues configuration
issues:
  # Maximum issues count per linter
  max-issues-per-linter: 50

  # Maximum count of issues with the same text
  max-same-issues: 3

  # Show all issues from a linter
  new-from-rev: ""

  # Exclude specific issues
  exclude-rules:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - gocognit
        - gocyclo
        - dupl
        - gosec
        - maintidx

    # Exclude shadow checking on the variable named err
    - linters:
        - govet
      text: 'shadow: declaration of "(err|ctx)"'

    # Exclude linters for generated code
    - path: ".*\\.pb\\.go$"
      linters:
        - all

    # Allow dot imports for Bubble Tea DSL in tests
    - path: _test\.go
      linters:
        - revive
      text: "dot-imports"

    # Allow package comments to be missing in internal packages
    - path: internal/
      linters:
        - revive
      text: "package-comments"

    # Cognitive complexity can be higher in main Update methods (Bubble Tea pattern)
    - path: "(app|model)\\.go$"
      text: "cognitive complexity"
      linters:
        - gocognit

    # Allow longer switch statements in Update methods (Bubble Tea pattern)
    - path: "(app|model)\\.go$"
      text: "cyclomatic complexity"
      linters:
        - gocyclo

    # Baseline existing issues - ignore these specific cases
    # err113: Validation errors in validators.go (justified - UX requires dynamic messages)
    - path: internal/ui/components/forms/validators\.go
      linters:
        - err113

    # gosec: Already reviewed and justified
    - linters:
        - gosec
      text: "G304.*file inclusion"  # Legitimate file reads with proper validation
    - linters:
        - gosec
      text: "G101.*Potential hardcoded credentials"  # Test credentials only

    # gocognit: Complex functions that will be refactored later
    - path: internal/ui/components/forms/field\.go
      linters:
        - gocognit
      text: "cognitive complexity.*of func.*Field.*Update"
    - path: internal/ui/views/instances\.go
      linters:
        - gocognit
      text: "cognitive complexity.*of func.*InstancesView.*Update"
    - path: internal/ui/views/instance_details\.go
      linters:
        - gocognit
      text: "cognitive complexity.*of func.*InstanceDetailsView.*Update"
    - path: internal/ui/views/disks\.go
      linters:
        - gocognit
      text: "cognitive complexity.*of func.*DisksView.*Update"
    - path: internal/ui/views/objects\.go
      linters:
        - gocognit
      text: "cognitive complexity.*of func.*ObjectsView.*Update"
    - path: internal/ui/views/object_details\.go
      linters:
        - gocognit
      text: "cognitive complexity.*of func.*ObjectDetailView.*Update"

    # goconst: Repeated strings that are context-specific
    - linters:
        - goconst
      text: "string.*has.*occurrences"

    # prealloc: Slice preallocation optimizations (low priority)
    - linters:
        - prealloc

    # noctx: HTTP requests without context (will add context later)
    - linters:
        - noctx

    # unparam: Unused parameters (keeping for interface consistency)
    - path: internal/ui/app_navigation\.go
      linters:
        - unparam
      text: "handleInstanceEditComplete.*msg is unused"

  # Exclude known false positives and patterns
  exclude:
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv). is not checked"
    # Baseline: err113 validation errors
    - "do not define dynamic errors, use wrapped static errors instead"
    # Baseline: prealloc optimizations
    - "Consider pre-allocating"
    # Baseline: noctx issues
    - "must not be called"
    # Baseline: goconst repeated strings
    - "has .* occurrences, make it a constant"
    # Baseline: gocognit complexity
    - "cognitive complexity"
    # Baseline: gosec issues
    - "G301: Expect directory permissions"
    - "G304: Potential file inclusion via variable"
    - "G306: Expect WriteFile permissions"
    - "G101: Potential hardcoded credentials"
    # Baseline: unparam unused parameters
    - "msg is unused"

  # Exclude deprecation warnings
  exclude-use-default: false

# Run configuration
run:
  # Timeout for analysis
  timeout: 5m

  # Exit code when issues are found
  issues-exit-code: 1

  # Include test files
  tests: true

  # Build tags
  build-tags:
    - integration

  # Skip directories
  skip-dirs:
    - vendor
    - testdata
    - examples
    - third_party

  # Skip files
  skip-files:
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"

  # Concurrency level
  concurrency: 4

  # Allow multiple parallel golangci-lint instances
  allow-parallel-runners: true
